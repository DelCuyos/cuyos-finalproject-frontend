<div style="padding: 2rem;">
  <div style="width:320px;">

    
    <h1 style="font-size:18px;font-weight:600;color:#1a1a1a;margin:0 0 1.25rem;">My Profile</h1>

    <div *ngIf="account" style="background:#fff;border:1.5px solid #C41E3A;border-radius:12px;box-shadow:0 4px 24px rgba(196,30,58,0.08);overflow:hidden;">

      <div style="padding:1.25rem 1.5rem;display:flex;align-items:center;gap:12px;">
        <div style="width:44px;height:44px;border-radius:50%;background:#fff0f2;border:2px solid #f5c4d0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#C41E3A;flex-shrink:0;">
          {{ account.firstName?.charAt(0) }}{{ account.lastName?.charAt(0) }}
        </div>
        <div>
          <p style="font-size:13px;font-weight:600;color:#1a1a1a;margin:0;">
            {{ account.title }} {{ account.firstName }} {{ account.lastName }}
          </p>
          <p style="font-size:11px;color:#6c757d;margin:0;">{{ account.email }}</p>
        </div>
      </div>

      <hr class="mx-3 my-0" />

      <div style="padding:1rem 1.5rem;">
        <p style="font-size:10px;font-weight:500;letter-spacing:0.04em;color:#6c757d;margin:0 0 2px;">Role</p>
        <span style="font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;"
          [style.background]="account.role === 'Admin' ? '#fff0f2' : '#f1f3f5'"
          [style.color]="account.role === 'Admin' ? '#C41E3A' : '#6c757d'">
          {{ account.role }}
        </span>
      </div>

      <hr class="mx-3 my-0" />

      <div style="padding:1rem 1.5rem;">
        <a routerLink="update" class="btn"
          style="font-size:11px;font-weight:500;padding:6px 16px;border:1.5px solid #C41E3A;color:#C41E3A;border-radius:8px;background:transparent;text-decoration:none;">
          Update Profile
        </a>
      </div>

    </div>
  </div>
</div>
