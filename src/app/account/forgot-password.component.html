<div class="d-flex justify-content-center" style="padding-top: 80px;">
  <div style="width: 300px; background: #fff; border: 1.5px solid #C41E3A; border-radius: 12px;">
    <div style="padding: 1.25rem 1.5rem 1rem;">
      <h3 style="margin:0 0 6px; font-size:14px; font-weight:500;">Forgot Password</h3>
      <p class="text-muted mb-0" style="font-size:11px; line-height:1.5;">
        Enter your email and we'll send you a reset link.
      </p>
    </div>

    <hr class="mx-3 my-0" />

    <div style="padding: 1rem 1.5rem 1.25rem;">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label" style="font-size:11px; font-weight:500; letter-spacing:0.03em; color:#6c757d;">
            Email address
          </label>
          <input
            type="text"
            formControlName="email"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
            placeholder="you@company.com"
            style="font-size:12px;"
          />
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback" style="font-size:10px;">
            <div *ngIf="f.email.errors.required">Email is required</div>
            <div *ngIf="f.email.errors.email">Email is invalid</div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button
            type="submit"
            [disabled]="loading"
            class="btn btn-spotify-outline"
            style="width:auto; padding:6px 16px; font-size:11px;"
          >
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            {{ loading ? 'Sending…' : 'Submit' }}
          </button>
          <a routerLink="../login" class="btn btn-link text-muted" style="font-size:11px;">Cancel</a>
        </div>

      </form>
    </div>
  </div>
</div>
