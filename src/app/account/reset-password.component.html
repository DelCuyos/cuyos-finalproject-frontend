<div class="d-flex justify-content-center" style="padding-top: 80px;">
  <div style="width: 300px; background: #fff; border: 1.5px solid #C41E3A; border-radius: 12px;">

    <div style="padding: 1.25rem 1.5rem 1rem;">
      <h3 style="margin:0 0 6px; font-size:14px; font-weight:500;">Reset Password</h3>
      <p class="text-muted mb-0" style="font-size:11px; line-height:1.5;">
        Enter your new password below.
      </p>
    </div>

    <hr class="mx-3 my-0" />

    <div style="padding: 1rem 1.5rem 1.25rem;">

      <div *ngIf="tokenStatus == TokenStatus.Validating" style="font-size:12px; color:#6c757d;">
        Validating token...
      </div>

      <div *ngIf="tokenStatus == TokenStatus.Invalid" style="font-size:12px; color:#C41E3A; line-height:1.5;">
        Token validation failed. If the token has expired you can get a new one at the
        <a routerLink="../forgot-password" style="color:#C41E3A;">forgot password</a> page.
      </div>

      <form *ngIf="tokenStatus == TokenStatus.Valid" [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label" style="font-size:11px; font-weight:500; letter-spacing:0.03em; color:#6c757d;">
            Password
          </label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
            style="font-size:12px;"
          />
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback" style="font-size:10px;">
            <div *ngIf="f.password.errors.required">Password is required</div>
            <div *ngIf="f.password.errors.minlength">Password must be at least 6 characters</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" style="font-size:11px; font-weight:500; letter-spacing:0.03em; color:#6c757d;">
            Confirm Password
          </label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.confirmPassword.errors }"
            style="font-size:12px;"
          />
          <div *ngIf="submitted && f.confirmPassword.errors" class="invalid-feedback" style="font-size:10px;">
            <div *ngIf="f.confirmPassword.errors.required">Confirm Password is required</div>
            <div *ngIf="f.confirmPassword.errors.mustMatch">Passwords must match</div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button
            type="submit"
            [disabled]="loading"
            class="btn btn-spotify-outline"
            style="width:auto; padding:6px 16px; font-size:11px;"
          >
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            {{ loading ? 'Resetting…' : 'Reset Password' }}
          </button>
          <a routerLink="../login" class="btn btn-link text-muted" style="font-size:11px;">Cancel</a>
        </div>

      </form>
    </div>

  </div>
</div>
