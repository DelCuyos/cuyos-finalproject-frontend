<div class="d-flex justify-content-center" style="padding-top: 80px;">
  <div style="width: 320px; background: #fff; border: 1.5px solid #C41E3A; border-radius: 12px; box-shadow: 0 4px 24px rgba(196,30,58,0.10);">

    <div style="padding: 1.5rem 1.5rem 1rem;">
      <div style="width:36px;height:4px;background:#C41E3A;border-radius:2px;margin-bottom:12px;"></div>
      <h3 style="margin:0 0 4px;font-size:18px;font-weight:600;color:#1a1a1a;">Login    </h3>
      <p class="text-muted mb-0" style="font-size:11px;line-height:1.5;">Sign in to continue to your account.</p>
    </div>

    <hr class="mx-3 my-0" />

    <div style="padding: 1.25rem 1.5rem 1.5rem;">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label" style="font-size:11px;font-weight:500;letter-spacing:0.03em;color:#6c757d;">
            Email
          </label>
          <input
            type="text"
            formControlName="email"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
            placeholder="you@company.com"
            style="font-size:12px;"
          />
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback" style="font-size:10px;">
            <div *ngIf="f.email.errors.required">Email is required</div>
            <div *ngIf="f.email.errors.email">Email is invalid</div>
          </div>
        </div>

        <div class="mb-1">
          <label class="form-label" style="font-size:11px;font-weight:500;letter-spacing:0.03em;color:#6c757d;">
            Password
          </label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f.password.errors }"
            placeholder="••••••••"
            style="font-size:12px;"
          />
          <div *ngIf="submitted && f.password.errors" class="invalid-feedback" style="font-size:10px;">
            <div *ngIf="f.password.errors.required">Password is required</div>
          </div>
        </div>

        <div class="text-end mb-3">
          <a routerLink="../forgot-password" style="font-size:11px;color:#C41E3A;text-decoration:none;">
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          [disabled]="submitting"
          class="btn w-100"
          style="background:#C41E3A;color:#fff;font-size:12px;font-weight:500;padding:8px;border-radius:8px;border:none;letter-spacing:0.03em;"
        >
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
          {{ submitting ? 'Signing in…' : 'Sign in' }}
        </button>

        <div class="text-center mt-3">
          <span style="font-size:11px;color:#6c757d;">Don't have an account?</span>
          <a routerLink="../register" style="font-size:11px;color:#C41E3A;text-decoration:none;margin-left:4px;font-weight:500;">
            Register
          </a>
        </div>

      </form>
    </div>

  </div>
</div>
