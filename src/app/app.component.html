<div class="app-container">
    <!-- main nav -->
    <nav class="navbar navbar-expand navbar-dark px-3" style="background: linear-gradient(90deg, #C41E3A 0%, #FF8C00 100%); border-bottom: 2px solid #FFD700;" *ngIf="account">
        <div class="navbar-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item nav-link" style="color: rgba(255,255,255,0.85); font-weight: 600;">Home</a>
        <a routerLink="/profile" routerLinkActive="active" class="nav-item nav-link" style="color: rgba(255,255,255,0.85); font-weight: 600;">Profile</a>
        <a *ngIf="account.role === Role.Admin" routerLink="/admin" routerLinkActive="active" class="nav-item nav-link" style="color: rgba(255,255,255,0.85); font-weight: 600;">Admin</a>
        <button (click)="logout()" class="btn btn-link nav-item nav-link" style="color: rgba(255,255,255,0.85); font-weight: 600; text-decoration: none;">Logout</button>
        </div>
    </nav>

    <!-- subnav router outlet -->
    <router-outlet name="subnav"></router-outlet>

    <!-- global alert -->
    <alert></alert>

    <!-- main router outlet -->
    <router-outlet></router-outlet>
</div>
