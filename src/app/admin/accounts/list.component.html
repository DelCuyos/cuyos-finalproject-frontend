<div style="padding: 2rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
    <div>
      <div style="width:36px;height:4px;background:#C41E3A;border-radius:2px;margin-bottom:10px;"></div>
      <h1 style="font-size:18px;font-weight:600;color:#1a1a1a;margin:0;">Accounts</h1>
      <p style="font-size:11px;color:#6c757d;margin:4px 0 0;">All accounts from secure admin-only endpoint.</p>
    </div>
    <a routerLink="add" class="btn" style="background:#C41E3A;color:#fff;font-size:11px;font-weight:500;padding:6px 14px;border-radius:8px;border:none;">
      + Create Account
    </a>
  </div>

  <div style="background:#fff;border:1.5px solid #C41E3A;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(196,30,58,0.08);">
    <table class="table mb-0" style="font-size:12px;">
      <thead>
        <tr style="background:#fff7f8;border-bottom:1.5px solid #f5c4d0;">
          <th style="width:30%;padding:10px 16px;font-weight:500;color:#6c757d;letter-spacing:0.03em;border:none;">Name</th>
          <th style="width:30%;padding:10px 16px;font-weight:500;color:#6c757d;letter-spacing:0.03em;border:none;">Email</th>
          <th style="width:20%;padding:10px 16px;font-weight:500;color:#6c757d;letter-spacing:0.03em;border:none;">Role</th>
          <th style="width:20%;padding:10px 16px;border:none;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let account of accounts" style="border-bottom:1px solid #fdeaee;">
          <td class="align-middle" style="padding:10px 16px;color:#1a1a1a;font-weight:500;">
            {{account.title}} {{account.firstName}} {{account.lastName}}
          </td>
          <td class="align-middle" style="padding:10px 16px;color:#6c757d;">{{account.email}}</td>
          <td class="align-middle" style="padding:10px 16px;">
            <span style="font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;"
              [style.background]="account.role === 'Admin' ? '#fff0f2' : '#f1f3f5'"
              [style.color]="account.role === 'Admin' ? '#C41E3A' : '#6c757d'">
              {{account.role}}
            </span>
          </td>
          <td class="align-middle" style="padding:10px 16px;white-space:nowrap;text-align:right;">
            <a routerLink="edit/{{account.id}}" class="btn btn-sm me-1"
              style="font-size:11px;padding:4px 12px;border:1px solid #C41E3A;color:#C41E3A;border-radius:6px;background:transparent;">
              Edit
            </a>
            <button (click)="deleteAccount(account.id)" class="btn btn-sm"
              [disabled]="account.isDeleting"
              style="font-size:11px;padding:4px 12px;border:1px solid #dee2e6;color:#6c757d;border-radius:6px;background:transparent;">
              <span *ngIf="account.isDeleting" class="spinner-border spinner-border-sm"></span>
              <span *ngIf="!account.isDeleting">Delete</span>
            </button>
          </td>
        </tr>
        <tr *ngIf="!accounts">
          <td colspan="4" class="text-center" style="padding:2rem;">
            <span class="spinner-border spinner-border-sm" style="color:#C41E3A;"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
